<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Recettes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&amp;display=swap">
<style>
body{margin:0;background:#000000}
.on-card:focus-visible{outline:3px solid #000000;outline-offset:2px}
.card-field:focus-within{outline:3px solid #EDEDED;outline-offset:-3px}
.card-field input::placeholder{color:#4A4A4A;opacity:1}
.no-scroll{scrollbar-width:none;-ms-overflow-style:none}
.no-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #000000; font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; gap: 4px; overflow: hidden">

<div style="flex: none; box-sizing: border-box; min-height: 96px; padding: 0 28px 0 24px; border-radius: 0 0 32px 32px; background: #EDEDED; display: flex; align-items: center">
<div>
<h1 style="margin: 0; font-size: 32px; line-height: 34px; font-weight: 600; color: #000000">Recettes</h1>
<div style="font-size: 17px; line-height: 22px; font-weight: 500; color: #4A4A4A">{{summary}}</div>
</div>
</div>

<div class="card-field" style="flex: none; display: flex; align-items: center; gap: 12px; min-height: 64px; box-sizing: border-box; padding: 0 28px 0 24px; border-radius: 32px; background: #8FD9E8">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input type="search" aria-label="Rechercher une recette" placeholder="Rechercher une recette" value="{{query}}" onChange="{{onQuery}}" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; padding: 0; color: #000000; font-family: inherit; font-size: 20px; font-weight: 600">
</div>

<div class="no-scroll" style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; overflow-y: auto">
<sc-for list="{{recipes}}" as="r" hint-placeholder-count="5">
<div style="flex: none; display: flex; align-items: center; gap: 12px; box-sizing: border-box; min-height: 96px; padding: 8px 28px 8px 24px; border-radius: 32px; background: #EDEDED">
<a href="Detail.dc.html" class="on-card" aria-label="{{r.openAria}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #000000; border-radius: 24px">
<div style="flex: none; width: 80px; height: 80px; border-radius: 24px; background: #000000; color: #EDEDED; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-size: 32px; line-height: 34px; font-weight: 600">{{r.count}}</span>
<span style="font-size: 14px; line-height: 18px; font-weight: 600">ingr.</span>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 20px; line-height: 24px; font-weight: 600; color: #000000">{{r.title}}</div>
<div style="font-size: 14px; line-height: 18px; color: #4A4A4A">{{r.meta}}</div>
</div>
</a>
<button type="button" class="on-card" aria-label="{{r.addAria}}" onClick="{{r.open}}" style="flex: none; width: 48px; height: 48px; box-sizing: border-box; border-radius: 16px; border: 2.5px solid #000000; background: {{r.btnBg}}; color: {{r.btnFg}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<sc-if value="{{r.inList}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
<sc-if value="{{r.notInList}}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</sc-if>
</button>
</div>
</sc-for>
<sc-if value="{{none}}" hint-placeholder-val="{{ false }}">
<div style="flex: none; display: flex; align-items: center; gap: 12px; box-sizing: border-box; min-height: 96px; padding: 8px 28px 8px 24px; border-radius: 32px; background: #EDEDED">
<div style="flex: none; width: 80px; height: 80px; border-radius: 24px; background: #000000; color: #EDEDED; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-size: 32px; line-height: 34px; font-weight: 600">0</span>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 20px; line-height: 24px; font-weight: 600; color: #000000">Aucune recette trouvée</div>
<div style="font-size: 14px; line-height: 18px; color: #4A4A4A">Essaie un autre mot</div>
</div>
</div>
</sc-if>
</div>

<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-modal="true" aria-label="Choisir le nombre de parts" style="flex: none; box-sizing: border-box; padding: 20px 24px; border-radius: 32px 32px 0 0; background: #EDEDED">
<div style="font-size: 20px; line-height: 24px; font-weight: 600; color: #000000">Pour combien de parts ?</div>
<div style="font-size: 14px; line-height: 18px; color: #4A4A4A">{{sheetTitle}}</div>
<div style="margin-top: 12px; box-sizing: border-box; padding: 8px; border-radius: 24px; background: #FFD84A; display: flex; align-items: center; justify-content: space-between; gap: 8px">
<button type="button" class="on-card" aria-label="Diminuer le nombre de parts" onClick="{{dec}}" style="flex: none; width: 48px; height: 48px; border-radius: 999px; border: 1.5px solid #000000; background: transparent; color: #000000; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"></path></svg>
</button>
<div aria-live="polite" style="text-align: center; font-size: 28px; line-height: 32px; font-weight: 600; color: #000000">{{sheetParts}} <span style="font-size: 17px; line-height: 24px; font-weight: 500">{{sheetPartsLabel}}</span></div>
<button type="button" class="on-card" aria-label="Augmenter le nombre de parts" onClick="{{inc}}" style="flex: none; width: 48px; height: 48px; border-radius: 999px; border: 1.5px solid #000000; background: transparent; color: #000000; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
<div style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" class="on-card" onClick="{{confirm}}" style="flex: 1 1 180px; min-height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: 0; background: #A8D26B; color: #000000; font-family: inherit; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
<span>{{confirmLabel}}</span>
</button>
<button type="button" class="on-card" onClick="{{cancel}}" style="flex: 1 1 100px; min-height: 56px; box-sizing: border-box; padding: 0 20px; border-radius: 999px; border: 2.5px solid #000000; background: transparent; color: #000000; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Annuler</button>
</div>
<sc-if value="{{sheetInList}}" hint-placeholder-val="{{ false }}">
<button type="button" class="on-card" onClick="{{removeFromList}}" style="margin-top: 8px; width: 100%; min-height: 48px; box-sizing: border-box; padding: 0 20px; border-radius: 999px; border: 2.5px dashed #000000; background: transparent; color: #000000; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Retirer de la liste</button>
</sc-if>
</div>
</sc-if>

<sc-if value="{{sheetClosed}}" hint-placeholder-val="{{ true }}">
<div style="flex: none; box-sizing: border-box; padding: 20px 24px; border-radius: 32px 32px 0 0; background: #EDEDED">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="Form.dc.html" class="on-card" style="flex: 1 1 180px; min-height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; background: #A8D26B; color: #000000; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
<span>Nouvelle recette</span>
</a>
<a href="Import.dc.html" class="on-card" aria-label="Importer une recette" style="flex: none; min-height: 56px; box-sizing: border-box; padding: 0 20px; border-radius: 999px; background: #000000; color: #EDEDED; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; text-decoration: none">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10M8 10l4 4 4-4M5 20h14"></path></svg>
<span>Importer</span>
</a>
</div>
<div aria-hidden="true" style="position: relative; z-index: 1; height: 1px; margin: 16px -24px">
<div style="position: absolute; left: 22px; right: 22px; top: 0; height: 1px; background-image: repeating-linear-gradient(90deg, #000000 0, #000000 18px, transparent 18px, transparent 32px)"></div>
<span style="position: absolute; left: -12px; top: -11.5px; width: 24px; height: 24px; border-radius: 999px; background: #000000"></span>
<span style="position: absolute; right: -12px; top: -11.5px; width: 24px; height: 24px; border-radius: 999px; background: #000000"></span>
</div>
<nav aria-label="Navigation principale" style="display: flex; gap: 8px">
<a href="Recettes.dc.html" aria-current="page" class="on-card" style="flex: 1; min-height: 52px; box-sizing: border-box; border-radius: 999px; background: #000000; color: #EDEDED; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; font-size: 14px; line-height: 18px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5C4.7 19 4 18.3 4 17.5z"></path><path d="M20 5.5C20 4.7 19.3 4 18.5 4H13v15h5.5c.8 0 1.5-.7 1.5-1.5z"></path></svg>
<span>Recettes</span>
</a>
<a href="Main.dc.html" class="on-card" style="flex: 1; min-height: 52px; box-sizing: border-box; border-radius: 999px; background: transparent; color: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; font-size: 14px; line-height: 18px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l1.5 1.5L8 5.5M4 12.5l1.5 1.5L8 11.5M4 18.5l1.5 1.5L8 17.5M11 7h9M11 13h9M11 19h9"></path></svg>
<span>Courses</span>
</a>
<a href="#" class="on-card" style="flex: 1; min-height: 52px; box-sizing: border-box; border-radius: 999px; background: transparent; color: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; font-size: 14px; line-height: 18px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>
<span>Réglages</span>
</a>
</nav>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { query: '', lists: { soupe: 6 }, sheet: null, sheetParts: 4 };

  renderVals() {
    const s = this.state;
    const lists = s.lists || {};
    const all = [
      { id: 'gratin', title: 'Gratin dauphinois', base: 4, ing: 6 },
      { id: 'soupe', title: 'Soupe de potiron', base: 6, ing: 7 },
      { id: 'tarte', title: 'Tarte aux pommes', base: 8, ing: 6 },
      { id: 'poulet', title: 'Poulet rôti et pommes de terre', base: 4, ing: 8 },
      { id: 'salade', title: 'Salade niçoise', base: 2, ing: 9 },
      { id: 'lasagnes', title: 'Lasagnes', base: 6, ing: 11 }
    ];
    const pl = (n) => n + (n > 1 ? ' parts' : ' part');
    const norm = (t) => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const q = norm(s.query || '');
    const shown = all.filter((r) => norm(r.title).includes(q));
    const recipes = shown.map((r) => {
      const on = lists[r.id] !== undefined;
      return {
        title: r.title,
        count: r.ing,
        meta: on ? 'Dans la liste · ' + pl(lists[r.id]) : 'Pas dans la liste',
        inList: on,
        notInList: !on,
        btnBg: on ? 'transparent' : '#000000',
        btnFg: on ? '#000000' : '#EDEDED',
        openAria: r.title + ', ' + r.ing + ' ingrédients, ouvrir la recette',
        addAria: on ? r.title + ', dans la liste pour ' + pl(lists[r.id]) + ', modifier' : 'Ajouter ' + r.title + ' à la liste',
        open: () => this.setState({ sheet: r.id, sheetParts: on ? lists[r.id] : r.base })
      };
    });
    const cur = all.find((r) => r.id === s.sheet);
    const curIn = !!cur && lists[cur.id] !== undefined;
    const close = () => this.setState({ sheet: null });
    return {
      recipes,
      none: recipes.length === 0,
      summary: all.length + ' recettes',
      query: s.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
      sheetOpen: !!cur,
      sheetClosed: !cur,
      sheetTitle: cur ? cur.title : '',
      sheetParts: s.sheetParts,
      sheetPartsLabel: s.sheetParts > 1 ? 'parts' : 'part',
      sheetInList: curIn,
      confirmLabel: curIn ? 'Mettre à jour' : 'Ajouter à la liste',
      dec: () => this.setState({ sheetParts: s.sheetParts > 1 ? s.sheetParts - 1 : 1 }),
      inc: () => this.setState({ sheetParts: s.sheetParts < 99 ? s.sheetParts + 1 : 99 }),
      confirm: () => this.setState({ lists: { ...lists, [s.sheet]: s.sheetParts }, sheet: null }),
      cancel: close,
      removeFromList: () => {
        const next = { ...lists };
        delete next[s.sheet];
        this.setState({ lists: next, sheet: null });
      }
    };
  }
}
</script>
</body>
</html>
