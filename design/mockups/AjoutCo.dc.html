<!doctype html>
<html lang="co">
<head>
<meta charset="utf-8">
<title>Novu articulu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&amp;display=swap">
<style>
body{margin:0;background:#000}
.on-card:focus-visible{outline:3px solid #000000;outline-offset:2px}
.card-field:focus-within{outline:3px solid #EDEDED;outline-offset:-3px}
.card-field input::placeholder{color:#4A4A4A;opacity:1}
.no-scroll{scrollbar-width:none;-ms-overflow-style:none}
.no-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #000000; font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; gap: 4px; overflow: hidden">

<div style="flex: none; box-sizing: border-box; min-height: 96px; padding: 0 28px 0 24px; border-radius: 0 0 32px 32px; background: #EDEDED; display: flex; align-items: center; gap: 12px">
<a href="Corse.dc.html" class="on-card" aria-label="Torna à a lista" style="flex: none; width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #000000; display: flex; align-items: center; justify-content: center; color: #000000; text-decoration: none">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<h1 style="margin: 0; font-size: 32px; line-height: 34px; font-weight: 600; color: #000000">Novu articulu</h1>
</div>

<div class="no-scroll" style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; overflow-y: auto">
<div style="position: relative; flex: none; display: flex; flex-direction: column">
<div class="card-field" style="flex: none; box-sizing: border-box; padding: 14px 28px 14px 24px; border-radius: 32px 32px 0 0; background: #FFD84A">
<label for="article-name" style="display: block; font-size: 14px; line-height: 18px; font-weight: 600; color: #4A4A4A">Articulu</label>
<input id="article-name" type="text" value="{{name}}" onChange="{{setName}}" placeholder="Ex. Latte" style="margin-top: 2px; width: 100%; box-sizing: border-box; height: 36px; padding: 0; background: transparent; border: 0; outline: none; color: #000000; font-family: inherit; font-size: 24px; line-height: 28px; font-weight: 600">
</div>

<div aria-hidden="true" style="position: relative; z-index: 1; height: 1px; background: #FFD84A">
<div style="position: absolute; left: 22px; right: 22px; top: 0; height: 1px; background-image: repeating-linear-gradient(90deg, #000000 0, #000000 18px, transparent 18px, transparent 32px)"></div>
<span style="position: absolute; left: -12px; top: -11.5px; width: 24px; height: 24px; border-radius: 999px; background: #000000"></span>
<span style="position: absolute; right: -12px; top: -11.5px; width: 24px; height: 24px; border-radius: 999px; background: #000000"></span>
</div>

<div style="flex: none; box-sizing: border-box; padding: 14px 28px 14px 24px; border-radius: 0 0 32px 32px; background: #FFD84A">
<div style="font-size: 14px; line-height: 18px; font-weight: 600; color: #4A4A4A">Quantità</div>
<div style="margin-top: 6px; display: flex; align-items: center; gap: 8px">
<button type="button" class="on-card" aria-label="Menu a quantità" onClick="{{dec}}" style="flex: none; width: 48px; height: 48px; border-radius: 999px; border: 1.5px solid #000000; background: transparent; color: #000000; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"></path></svg>
</button>
<div aria-live="polite" style="min-width: 56px; text-align: center; font-size: 28px; line-height: 32px; font-weight: 600; color: #000000">{{qty}}</div>
<button type="button" class="on-card" aria-label="Più quantità" onClick="{{inc}}" style="flex: none; width: 48px; height: 48px; border-radius: 999px; border: 1.5px solid #000000; background: transparent; color: #000000; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
<div role="group" aria-label="Unità" style="margin-top: 8px; display: flex; gap: 8px">
<sc-for list="{{units}}" as="unit" hint-placeholder-count="4">
<button type="button" class="on-card" aria-pressed="{{unit.pressed}}" onClick="{{unit.pick}}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid {{unit.border}}; background: {{unit.bg}}; color: {{unit.fg}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{unit.label}}</button>
</sc-for>
</div>
</div>

</div>

<div style="flex: none; box-sizing: border-box; padding: 14px 28px 14px 24px; border-radius: 32px; background: #EDEDED">
<div style="font-size: 14px; line-height: 18px; font-weight: 600; color: #4A4A4A">Reparu</div>
<div role="group" aria-label="Reparu" style="margin-top: 6px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 8px">
<sc-for list="{{cats}}" as="cat" hint-placeholder-count="6">
<button type="button" class="on-card" aria-pressed="{{cat.pressed}}" onClick="{{cat.pick}}" style="display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 4px; background: transparent; border: 0; padding: 0; color: #000000; font-family: inherit; cursor: pointer">
<span style="position: relative; display: flex; align-items: center; justify-content: center; height: 64px; box-sizing: border-box; border-radius: 22px; background: {{cat.tile}}; border: 3px solid {{cat.ring}}">
<sc-if value="{{cat.isCircle}}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#000"/></svg>
</sc-if>
<sc-if value="{{cat.isLeaf}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 40 40"><path d="M4 20A16 16 0 0 1 20 4H36V20A16 16 0 0 1 20 36H4Z" fill="#000"/></svg>
</sc-if>
<sc-if value="{{cat.isTriangle}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 40 40"><polygon points="20,3 37,35 3,35" fill="#000"/></svg>
</sc-if>
<sc-if value="{{cat.isHalftilt}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 40 40"><g transform="rotate(35 20 22)"><path d="M3 30A17 17 0 0 1 37 30Z" fill="#000"/></g></svg>
</sc-if>
<sc-if value="{{cat.isSquare}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 40 40"><rect x="4" y="4" width="32" height="32" rx="6" fill="#000"/></svg>
</sc-if>
<sc-if value="{{cat.isHalf}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 40 40"><path d="M3 30A17 17 0 0 1 37 30Z" fill="#000"/></svg>
</sc-if>
<sc-if value="{{cat.isQuarter}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 40 40"><path d="M5 35V5A30 30 0 0 1 35 35Z" fill="#000"/></svg>
</sc-if>
<sc-if value="{{cat.isFlake}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 40 40"><g stroke="#000" stroke-width="4" stroke-linecap="round"><path d="M20 4V36"/><path d="M6.1 12L33.9 28"/><path d="M6.1 28L33.9 12"/></g></svg>
</sc-if>
<sc-if value="{{cat.isDiamond}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 40 40"><polygon points="20,2 38,20 20,38 2,20" fill="#000"/></svg>
</sc-if>
<sc-if value="{{cat.isHouse}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 40 40"><path d="M20 3L37 19H32V36H8V19H3Z" fill="#000"/></svg>
</sc-if>
<sc-if value="{{cat.isDash}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="36" height="36" viewBox="0 0 40 40"><rect x="5" y="17" width="30" height="6" rx="3" fill="#000"/></svg>
</sc-if>
<sc-if value="{{cat.pressed}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 999px; background: #000000; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#EDEDED" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
</sc-if>
</span>
<span style="font-size: 14px; line-height: 18px; font-weight: {{cat.weight}}; text-align: center; color: #000000">{{cat.label}}</span>
</button>
</sc-for>
</div>
</div>

<div style="position: relative; flex: none; display: flex; align-items: center; gap: 12px; box-sizing: border-box; min-height: 96px; padding: 8px 28px 8px 24px; border-radius: 32px; background: #EDEDED">
<div style="flex: none; width: 80px; height: 80px; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: {{pTile}}">
<sc-if value="{{pCircle}}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#000"/></svg>
</sc-if>
<sc-if value="{{pLeaf}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 40 40"><path d="M4 20A16 16 0 0 1 20 4H36V20A16 16 0 0 1 20 36H4Z" fill="#000"/></svg>
</sc-if>
<sc-if value="{{pTriangle}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 40 40"><polygon points="20,3 37,35 3,35" fill="#000"/></svg>
</sc-if>
<sc-if value="{{pHalftilt}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 40 40"><g transform="rotate(35 20 22)"><path d="M3 30A17 17 0 0 1 37 30Z" fill="#000"/></g></svg>
</sc-if>
<sc-if value="{{pSquare}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 40 40"><rect x="4" y="4" width="32" height="32" rx="6" fill="#000"/></svg>
</sc-if>
<sc-if value="{{pHalf}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 40 40"><path d="M3 30A17 17 0 0 1 37 30Z" fill="#000"/></svg>
</sc-if>
<sc-if value="{{pQuarter}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 40 40"><path d="M5 35V5A30 30 0 0 1 35 35Z" fill="#000"/></svg>
</sc-if>
<sc-if value="{{pFlake}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 40 40"><g stroke="#000" stroke-width="4" stroke-linecap="round"><path d="M20 4V36"/><path d="M6.1 12L33.9 28"/><path d="M6.1 28L33.9 12"/></g></svg>
</sc-if>
<sc-if value="{{pDiamond}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 40 40"><polygon points="20,2 38,20 20,38 2,20" fill="#000"/></svg>
</sc-if>
<sc-if value="{{pHouse}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 40 40"><path d="M20 3L37 19H32V36H8V19H3Z" fill="#000"/></svg>
</sc-if>
<sc-if value="{{pDash}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 40 40"><rect x="5" y="17" width="30" height="6" rx="3" fill="#000"/></svg>
</sc-if>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 20px; line-height: 24px; font-weight: 600; color: #000000">{{pName}}</div>
<div style="font-size: 14px; line-height: 18px; color: #4A4A4A">{{pMeta}}</div>
</div>
<span style="position: absolute; top: 10px; right: 24px; padding: 3px 12px; border-radius: 999px; background: #FF8A3D; color: #000000; font-size: 14px; line-height: 20px; font-weight: 700; transform: rotate(-4deg)">Anteprima</span>
</div>

</div>

<div style="flex: none; box-sizing: border-box; padding: 20px 24px; border-radius: 32px 32px 0 0; background: #EDEDED">
<a href="Corse.dc.html" class="on-card" style="height: 56px; border-radius: 999px; background: #A8D26B; color: #000000; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Aghjunghje à a lista</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { name: 'Pomi', qty: 2, unit: 'kg', cat: 'fruits' };

  renderVals() {
    const s = this.state;
    const catDefs = [
      { id: 'fruits', label: 'Frutti', tile: '#E5484D', shape: 'circle' },
      { id: 'legumes', label: 'Legumi', tile: '#A8D26B', shape: 'leaf' },
      { id: 'boulangerie', label: 'Pane', tile: '#FFD84A', shape: 'triangle' },
      { id: 'boucherie', label: 'Carne è pesciu', tile: '#E8788A', shape: 'halftilt' },
      { id: 'cremerie', label: 'Latticini', tile: '#BDBDBD', shape: 'square' },
      { id: 'epicerie_salee', label: 'Dispensa salata', tile: '#FF8A3D', shape: 'half' },
      { id: 'epicerie_sucree', label: 'Dispensa dolce', tile: '#FF8A3D', shape: 'quarter' },
      { id: 'surgeles', label: 'Surgelati', tile: '#8FA3B8', shape: 'flake' },
      { id: 'boissons', label: 'Bevande', tile: '#8FD9E8', shape: 'diamond' },
      { id: 'hygiene', label: 'Igiena è pulizia', tile: '#F7A8D8', shape: 'house' },
      { id: 'autre', label: 'Altru', tile: '#BDBDBD', shape: 'dash' }
    ];
    const shapeNames = ['circle', 'leaf', 'triangle', 'halftilt', 'square', 'half', 'quarter', 'flake', 'diamond', 'house', 'dash'];
    const cur = catDefs.find((c) => c.id === s.cat) || catDefs[0];
    const cats = catDefs.map((c) => {
      const on = c.id === s.cat;
      return {
        label: c.label,
        tile: c.tile,
        pressed: on,
        ring: on ? '#000000' : 'transparent',
        weight: on ? '700' : '500',
        ...Object.fromEntries(shapeNames.map((n) => ['is' + n[0].toUpperCase() + n.slice(1), c.shape === n])),
        pick: () => this.setState({ cat: c.id })
      };
    });
    const units = ['pezzu', 'kg', 'g', 'L'].map((u) => {
      const on = s.unit === u;
      return {
        label: u,
        pressed: on,
        bg: on ? '#000000' : 'transparent',
        fg: on ? '#EDEDED' : '#000000',
        border: on ? '#000000' : '#4A4A4A',
        pick: () => this.setState({ unit: u })
      };
    });
    const qtyText = s.unit === 'pezzu' ? String(s.qty) : s.qty + ' ' + s.unit;
    return {
      name: s.name,
      setName: (e) => this.setState({ name: e.target.value }),
      qty: s.qty,
      dec: () => this.setState({ qty: s.qty > 1 ? s.qty - 1 : 1 }),
      inc: () => this.setState({ qty: s.qty + 1 }),
      units,
      cats,
      pName: (s.name || '').trim() || "Nome di l'articulu",
      pMeta: qtyText + ' · ' + cur.label,
      pTile: cur.tile,
      ...Object.fromEntries(shapeNames.map((n) => ['p' + n[0].toUpperCase() + n.slice(1), cur.shape === n]))
    };
  }
}
</script>
</body>
</html>
