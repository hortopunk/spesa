<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Liste de courses</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&amp;display=swap">
<style>
body{margin:0;background:#000}
.on-card:focus-visible{outline:3px solid #000000;outline-offset:2px}
.card-field:focus-within{outline:3px solid #EDEDED;outline-offset:-3px}
.card-field input::placeholder{color:#4A4A4A;opacity:1}
.no-scroll{scrollbar-width:none;-ms-overflow-style:none}
.no-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #000000; font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; gap: 4px; overflow: hidden">

<div style="flex: none; box-sizing: border-box; min-height: 96px; padding: 0 28px 0 24px; border-radius: 0 0 32px 32px; background: #EDEDED; display: flex; align-items: center; justify-content: space-between">
<div>
<h1 style="margin: 0; font-size: 32px; line-height: 34px; font-weight: 600; color: #000000">Courses</h1>
<div style="font-size: 17px; line-height: 22px; font-weight: 500; color: #4A4A4A">{{summary}}</div>
</div>
</div>

<div class="card-field" style="flex: none; display: flex; align-items: center; gap: 12px; height: 64px; box-sizing: border-box; padding: 0 28px 0 24px; border-radius: 32px; background: #8FD9E8">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input type="search" aria-label="Rechercher un article" placeholder="Rechercher" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; padding: 0; color: #000000; font-family: inherit; font-size: 20px; font-weight: 600">
</div>

<div style="flex: none; display: flex; align-items: center; gap: 8px; height: 68px; box-sizing: border-box; padding: 0 24px; border-radius: 32px; background: #EDEDED">
<sc-for list="{{chips}}" as="chip" hint-placeholder-count="3">
<button type="button" class="on-card" aria-pressed="{{chip.pressed}}" onClick="{{chip.pick}}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid {{chip.border}}; background: {{chip.bg}}; color: {{chip.fg}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{chip.label}}</button>
</sc-for>
</div>

<div class="no-scroll" style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; overflow-y: auto">
<sc-for list="{{items}}" as="item" hint-placeholder-count="5">
<div style="flex: none; display: flex; align-items: center; gap: 12px; box-sizing: border-box; min-height: 96px; padding: 8px 28px 8px 24px; border-radius: 32px; background: {{item.cardBg}}">
<div style="flex: none; width: 80px; height: 80px; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: {{item.tile}}; opacity: {{item.tileOpacity}}">
<sc-if value="{{item.isSquare}}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 40 40"><rect x="4" y="4" width="32" height="32" rx="6" fill="#000000"></rect></svg>
</sc-if>
<sc-if value="{{item.isCircle}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#000000"></circle></svg>
</sc-if>
<sc-if value="{{item.isTriangle}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 40 40"><polygon points="20,3 37,35 3,35" fill="#000000"></polygon></svg>
</sc-if>
<sc-if value="{{item.isHalf}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 40 40"><path d="M3 30 A17 17 0 0 1 37 30 Z" fill="#000000"></path></svg>
</sc-if>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 20px; line-height: 24px; font-weight: 600; color: {{item.nameColor}}; text-decoration: {{item.deco}}">{{item.name}}</div>
<div style="font-size: 14px; line-height: 18px; color: {{item.metaColor}}">{{item.meta}}</div>
</div>
<button type="button" class="on-card" aria-label="{{item.aria}}" aria-pressed="{{item.pressed}}" onClick="{{item.toggle}}" style="flex: none; width: 48px; height: 48px; border-radius: 16px; border: 2.5px solid {{item.boxBorder}}; background: {{item.boxBg}}; color: #000000; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<sc-if value="{{item.done}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
</button>
</div>
</sc-for>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<div style="flex: none; display: flex; align-items: center; gap: 12px; box-sizing: border-box; min-height: 96px; padding: 8px 28px 8px 24px; border-radius: 32px; background: #EDEDED">
<div style="flex: none; width: 80px; height: 80px; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: {{emptyTile}}">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="{{emptyPath}}"></path></svg>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 20px; line-height: 24px; font-weight: 600; color: #000000">{{emptyTitle}}</div>
<div style="font-size: 14px; line-height: 18px; color: #4A4A4A">{{emptyMeta}}</div>
</div>
</div>
</sc-if>
</div>

<div style="flex: none; box-sizing: border-box; padding: 20px 24px; border-radius: 32px 32px 0 0; background: #EDEDED">
<a href="Ajout.dc.html" class="on-card" style="height: 56px; border-radius: 999px; background: #A8D26B; color: #000000; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
<span>Ajouter un article</span>
</a>
<div aria-hidden="true" style="position: relative; z-index: 1; height: 1px; margin: 16px -24px">
<div style="position: absolute; left: 22px; right: 22px; top: 0; height: 1px; background-image: repeating-linear-gradient(90deg, #000000 0, #000000 18px, transparent 18px, transparent 32px)"></div>
<span style="position: absolute; left: -12px; top: -11.5px; width: 24px; height: 24px; border-radius: 999px; background: #000000"></span>
<span style="position: absolute; right: -12px; top: -11.5px; width: 24px; height: 24px; border-radius: 999px; background: #000000"></span>
</div>
<nav aria-label="Navigation principale" style="display: flex; gap: 8px">
<a href="Recettes.dc.html" class="on-card" style="flex: 1; min-height: 52px; box-sizing: border-box; border-radius: 999px; background: transparent; color: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; font-size: 14px; line-height: 18px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5C4.7 19 4 18.3 4 17.5z"></path><path d="M20 5.5C20 4.7 19.3 4 18.5 4H13v15h5.5c.8 0 1.5-.7 1.5-1.5z"></path></svg>
<span>Recettes</span>
</a>
<a href="Main.dc.html" aria-current="page" class="on-card" style="flex: 1; min-height: 52px; box-sizing: border-box; border-radius: 999px; background: #000000; color: #EDEDED; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; font-size: 14px; line-height: 18px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l1.5 1.5L8 5.5M4 12.5l1.5 1.5L8 11.5M4 18.5l1.5 1.5L8 17.5M11 7h9M11 13h9M11 19h9"></path></svg>
<span>Courses</span>
</a>
<a href="#" class="on-card" style="flex: 1; min-height: 52px; box-sizing: border-box; border-radius: 999px; background: transparent; color: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; font-size: 14px; line-height: 18px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>
<span>Réglages</span>
</a>
</nav>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { done: { oeufs: true }, filter: 'all' };

  renderVals() {
    const done = this.state.done || {};
    const filter = this.state.filter || 'all';
    const base = [
      { id: 'lait', name: 'Lait demi-écrémé', qty: '2 L', cat: 'Crèmerie', tile: '#BDBDBD', shape: 'square' },
      { id: 'pommes', name: 'Pommes', qty: '1 kg', cat: 'Fruits', tile: '#E5484D', shape: 'circle' },
      { id: 'pain', name: 'Pain de campagne', qty: '1', cat: 'Boulangerie', tile: '#FFD84A', shape: 'triangle' },
      { id: 'oeufs', name: 'Œufs', qty: '12', cat: 'Crèmerie', tile: '#BDBDBD', shape: 'square' },
      { id: 'cafe', name: 'Café moulu', qty: '250 g', cat: 'Épicerie salée', tile: '#FF8A3D', shape: 'half' }
    ];
    const remaining = base.filter((b) => !done[b.id]).length;
    const summary = remaining === 0 ? 'Tout est dans le panier' : 'Il reste ' + remaining + ' article' + (remaining > 1 ? 's' : '');
    const shown = base.filter((b) => filter === 'all' || (filter === 'todo' ? !done[b.id] : !!done[b.id]));
    const items = shown.map((b) => {
      const d = !!done[b.id];
      return {
        name: b.name,
        meta: b.qty + ' · ' + b.cat,
        tile: b.tile,
        done: d,
        pressed: d,
        isSquare: b.shape === 'square',
        isCircle: b.shape === 'circle',
        isTriangle: b.shape === 'triangle',
        isHalf: b.shape === 'half',
        cardBg: d ? '#1A1A1A' : '#EDEDED',
        nameColor: d ? '#BDBDBD' : '#000000',
        metaColor: d ? '#BDBDBD' : '#4A4A4A',
        deco: d ? 'line-through' : 'none',
        tileOpacity: d ? '0.45' : '1',
        boxBg: d ? '#EDEDED' : 'transparent',
        boxBorder: d ? '#EDEDED' : '#000000',
        aria: b.name + ', ' + b.qty + ', ' + b.cat.toLowerCase() + ', ' + (d ? 'coché' : 'non coché'),
        toggle: () => this.setState({ done: { ...done, [b.id]: !done[b.id] } })
      };
    });
    const chipDefs = [
      { id: 'all', label: 'Tout' },
      { id: 'todo', label: 'À prendre' },
      { id: 'done', label: 'Pris' }
    ];
    const chips = chipDefs.map((c) => {
      const on = filter === c.id;
      return {
        label: c.label,
        pressed: on,
        bg: on ? '#000000' : 'transparent',
        fg: on ? '#EDEDED' : '#000000',
        border: on ? '#000000' : '#4A4A4A',
        pick: () => this.setState({ filter: c.id })
      };
    });
    const isEmpty = items.length === 0;
    const onDone = filter === 'done';
    return {
      items, chips, summary, isEmpty,
      emptyTitle: onDone ? 'Rien de pris' : 'Rien à prendre',
      emptyMeta: onDone ? 'Aucun article dans le panier' : 'Tout est dans le panier',
      emptyTile: onDone ? '#BDBDBD' : '#A8D26B',
      emptyPath: onDone ? 'M6 12h12' : 'M5 12.5l4.5 4.5L19 7.5'
    };
  }
}
</script>
</body>
</html>
