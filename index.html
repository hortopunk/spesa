<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Adapte la page à la largeur du téléphone -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPESA</title>
  <!-- Installation sur l'écran d'accueil -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d4f">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Zone qui affiche l'écran courant -->
  <main id="ecrans">
    <!-- Rappel discret : visible seulement si la dernière sauvegarde est ancienne -->
    <div id="bandeau-sauvegarde" hidden>
      <span id="bandeau-texte"></span>
      <button class="bouton" data-action="sauvegarder" data-i18n="sauvegarder"></button>
    </div>

    <section class="ecran" id="ecran-recettes" data-ecran="recettes">
      <!-- Trois vues : liste, détail, formulaire (une seule visible à la fois) -->
      <div id="vue-liste">
        <h1 data-i18n="titre_recettes"></h1>
        <input type="search" id="recherche" data-i18n-placeholder="recherche_recettes">
        <ul id="liste-recettes" class="cartes"></ul>
        <p class="vide" id="vide-recettes"></p>
        <button class="bouton principal" data-action="nouvelle" data-i18n="nouvelle_recette"></button>
        <button class="bouton bouton-import" data-action="importer" data-i18n="importer_recette"></button>
      </div>
      <div id="vue-detail" hidden></div>
      <div id="vue-form" hidden></div>
      <div id="vue-import" hidden></div>
      <!-- Sélecteur de fichier caché : ouvert par le bouton « Choisir un fichier » -->
      <input type="file" id="fichier-import" accept=".json,application/json,text/plain" hidden>
    </section>

    <section class="ecran" id="ecran-liste" data-ecran="liste" hidden>
      <h1 data-i18n="titre_liste"></h1>
      <div id="contenu-liste"></div>
    </section>

    <section class="ecran" id="ecran-courses" data-ecran="courses" hidden>
      <!-- Deux vues : la liste en cours et l'historique (consultation seule) -->
      <div id="vue-courses">
        <h1 data-i18n="titre_courses"></h1>
        <div id="contenu-courses"></div>
        <button class="bouton bouton-historique" data-action="historique-ouvrir" data-i18n="historique_ouvrir"></button>
      </div>
      <div id="vue-historique" hidden></div>
    </section>

    <section class="ecran" id="ecran-reglages" data-ecran="reglages" hidden>
      <h1 data-i18n="titre_reglages"></h1>
      <div id="contenu-reglages"></div>
      <!-- Sélecteur de fichier caché : ouvert par le bouton « Restaurer » -->
      <input type="file" id="fichier-restauration" accept=".json,application/json" hidden>
    </section>
  </main>

  <!-- Bouton flottant, toujours visible, au-dessus de la navigation -->
  <button id="bouton-sauvegarde" data-action="sauvegarder" data-i18n="sauvegarder"></button>

  <!-- Navigation en bas, à portée du pouce -->
  <nav id="navigation">
    <button class="onglet actif" data-cible="recettes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2zM8 7h6M8 11h6"/></svg>
      <span data-i18n="nav_recettes"></span>
    </button>
    <button class="onglet" data-cible="liste">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span data-i18n="nav_liste"></span>
    </button>
    <button class="onglet" data-cible="courses">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.5 11h10l2-8H6.5M9 20h.01M17 20h.01"/></svg>
      <span data-i18n="nav_courses"></span>
    </button>
    <button class="onglet" data-cible="reglages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M6 15v4"/></svg>
      <span data-i18n="nav_reglages"></span>
    </button>
  </nav>

  <!-- Ordre important : langue avant ui, app en dernier -->
  <script src="js/langue.js"></script>
  <script src="js/db.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
