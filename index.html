<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Adapte la page à la largeur du téléphone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>SPESA</title>
  <!-- Installation sur l'écran d'accueil -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- La police est chargée tout de suite (sans attendre le CSS) : pas de texte qui change de forme à l'affichage -->
  <link rel="preload" href="polices/archivo-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="design">
  <!-- Alerte (stockage plein, données abîmées) : une carte sombre en haut, cachée tant qu'il n'y a rien à dire -->
  <div id="alerte" role="alert" hidden></div>

  <!-- Zone qui affiche l'écran courant -->
  <main id="ecrans">
    <section class="ecran" id="ecran-recettes" data-ecran="recettes">
      <!-- Trois vues : liste, détail, formulaire (une seule visible à la fois) -->
      <div id="vue-liste"></div>
      <div id="vue-detail" hidden></div>
      <div id="vue-form" hidden></div>
      <div id="vue-import" hidden></div>
      <!-- Sélecteur de fichier caché : ouvert par le bouton « Choisir un fichier » -->
      <input type="file" id="fichier-import" accept=".json,application/json,text/plain" hidden>
    </section>

    <section class="ecran" id="ecran-liste" data-ecran="liste" hidden>
      <!-- Deux vues : la liste en cours (ajouts, révision ou courses selon l'étape) et l'historique -->
      <div id="vue-panier">
      <div id="contenu-liste"></div>
      </div>
      <div id="vue-ajout" hidden></div>
      <div id="vue-historique" hidden></div>
    </section>

    <section class="ecran" id="ecran-reglages" data-ecran="reglages" hidden>
      <div id="contenu-reglages"></div>
      <!-- Sélecteur de fichier caché : ouvert par le bouton « Restaurer » -->
      <input type="file" id="fichier-restauration" accept=".json,application/json" hidden>
    </section>
  </main>

  <!-- Message temporaire avec « Annuler » après une suppression : une carte sombre en haut -->
  <div id="annulation" role="status" hidden></div>

  <!-- Navigation en bas, à portée du pouce -->
  <nav id="navigation" data-i18n-aria-label="nav_principale">
    <!-- Perforation entre l'action et les onglets (visible seulement dans le nouvel habillage) -->
    <div class="perforation perforation-pied" aria-hidden="true">
      <div class="perforation-trait"></div>
      <span class="encoche gauche"></span>
      <span class="encoche droite"></span>
    </div>
    <button class="onglet actif" data-cible="recettes" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5C4.7 19 4 18.3 4 17.5z"/><path d="M20 5.5C20 4.7 19.3 4 18.5 4H13v15h5.5c.8 0 1.5-.7 1.5-1.5z"/></svg>
      <span data-i18n="nav_recettes"></span>
    </button>
    <button class="onglet" data-cible="liste">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5l1.5 1.5L8 5.5M4 12.5l1.5 1.5L8 11.5M4 18.5l1.5 1.5L8 17.5M11 7h9M11 13h9M11 19h9"/></svg>
      <span data-i18n="nav_courses"></span>
    </button>
    <button class="onglet" data-cible="reglages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      <span data-i18n="nav_reglages"></span>
    </button>
  </nav>

  <!-- Ordre important : langue avant ui, app en dernier -->
  <script src="js/langue.js"></script>
  <script src="js/composants.js"></script>
  <script src="js/db.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
